name: Build ROCm and TheRock JAX and XLA Docker images

on:
  push:
    branches:
      - rocm-jax-infra
    paths:
      - 'docker/Dockerfile.rocm'
      - 'docker/Dockerfile.theRock'
      - 'docker/python_requirements.txt'
      - '.github/workflows/build_hermetic_ub22_docker.yml'
  pull_request:
    paths:
      - 'docker/Dockerfile.rocm'
      - 'docker/Dockerfile.theRock'
      - 'docker/python_requirements.txt'
      - '.github/workflows/build_hermetic_ub22_docker.yml'
  workflow_dispatch:
    inputs:
      rocm-version:
        required: false
        type: string
        default: '7.2.4'
      theRock-version:
        required: false
        type: string
        default: '7.13.0'
      theRock-index-url:
        required: false
        type: string
        default: 'https://repo.amd.com/rocm/whl/gfx950-dcgpu/'
      runner-label:
        required: false
        default: amd-do-linux.jax.gpu.gfx950.1
        type: string
  workflow_call:
    inputs:
      rocm-version:
        required: false
        type: string
        default: '7.2.4'
      theRock-version:
        required: false
        type: string
        default: '7.13.0'
      theRock-index-url:
        required: false
        type: string
        default: 'https://repo.amd.com/rocm/whl/gfx950-dcgpu/'
      runner-label:
        required: false
        default: amd-do-linux.jax.gpu.gfx950.1
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    runs-on: ${{ inputs.runner-label || 'amd-do-linux.jax.gpu.gfx950.1' }}
    env:
      ROCM_VERSION: ${{ inputs.rocm-version || '7.2.4' }}
      THEROCK_VERSION: ${{ inputs.theRock-version || '7.13.0' }}
      THEROCK_INDEX_URL: >-
        ${{ inputs.theRock-index-url ||
        'https://repo.amd.com/rocm/whl/gfx950-dcgpu/' }}
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.rocm
            image-name: jax-build-ubu24.rocm
            build-args: --build-arg ROCM_VERSION=${{ env.ROCM_VERSION }}
          - dockerfile: Dockerfile.theRock
            image-name: jax-build-ubu24.therock
            build-args: >-
              --build-arg THEROCK_VERSION=${{ env.THEROCK_VERSION }}
              --build-arg THEROCK_INDEX_URL=${{ env.THEROCK_INDEX_URL }}
    steps:
      - name: Print system info
        run: |
          whoami
          printenv
          df -h
          rocm-smi -a || true
          rocminfo | grep gfx || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build ${{ matrix.image-name }} docker image
        working-directory: ./docker
        run: |
          IMAGE="ghcr.io/rocm/${{ matrix.image-name }}"

          docker build -f ${{ matrix.dockerfile }} \
            ${{ matrix.build-args }} \
            -t "${IMAGE}:latest" .

      - name: Push ${{ matrix.image-name }} docker image
        if: github.event_name != 'pull_request'
        working-directory: ./docker
        run: |
          IMAGE="ghcr.io/rocm/${{ matrix.image-name }}"

          docker push "${IMAGE}:latest"
