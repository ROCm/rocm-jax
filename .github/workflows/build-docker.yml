name: Build docker

on:
  workflow_call:
    inputs:
      rocm-version:
        required: true
        type: string
      rocm-build-job:
        required: false
        type: string
      rocm-build-num:
        required: false
        type: string
      runner-label:
        required: false
        type: string
      artifact-prefix:
        required: false
        default: 'plugin_wheels'
        type: string
      extra-cr-tag:
        required: false
        type: string
      wheels-repo:
        description: |
          ROCm/jax repository whose CI publishes the plugin/PJRT wheels.
        required: false
        type: string
        default: 'ROCm/jax'
      wheels-ref:
        description: |
          Git ref of the ROCm/jax wheel-producing branch. Used as the second
          path component of the S3 LATEST pointer.
        required: false
        type: string
        default: 'rocm-jaxlib-v0.10.0'
      rocm-release-version:
        description: |
          Full ROCm release version used to resolve the S3 LATEST pointer
          (e.g. '7.2.0' or 'therock-latest'). Defaults to rocm-version.
        required: false
        type: string
        default: ''
      wheel-version:
        description: |
          Override for the wheel filename namespace. Empty means derive from
          rocm-version: 6.x -> 60, otherwise the major version (e.g. 7).
        required: false
        type: string
        default: ''
      python-versions:
        description: |
          Comma separated list of Python versions to fetch plugin wheels for.
          Must match the versions the JAX Dockerfile installs.
        required: false
        type: string
        default: '3.11,3.12,3.13,3.14'

jobs:
  build-docker:
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    steps:
      - name: Clean up old runs
        run: |
          ls -lah
          # Make sure that we own all of the files so that we have permissions to delete them
          docker run --rm -v "./:/rocm-jax" ubuntu \
            /bin/bash -c "shopt -s dotglob; chown -R $UID /rocm-jax/* || true"
          # Remove any old work directories from this machine
          rm -rf * || true
          ls -lah
          # Clean up any docker stuff that's more than a week old
          docker system prune -a --filter "until=168h"
          # Stop any containers running for more than 12 hours. No CI job should take this long.
          docker ps --format="{{.RunningFor}} {{.Names}}" | grep hours \
              | awk -F: '{if($1>12)print$1}' | awk ' {print $4} ' | xargs docker stop || true
      - name: Print system info
        run: |
          whoami
          printenv
          df -h
          rocm-smi -a || true
          rocminfo | grep gfx || true
      - uses: actions/checkout@v4
      - name: Download ROCm JAX wheels from CloudFront
        env:
          INPUTS_WHEELS_REPO: ${{ inputs.wheels-repo }}
          INPUTS_WHEELS_REF: ${{ inputs.wheels-ref }}
          INPUTS_ROCM_VERSION: ${{ inputs.rocm-version }}
          INPUTS_ROCM_RELEASE_VERSION: ${{ inputs.rocm-release-version }}
          INPUTS_WHEEL_VERSION: ${{ inputs.wheel-version }}
          INPUTS_PYTHON_VERSIONS: ${{ inputs.python-versions }}
        run: |
          set -euo pipefail

          # ROCm/jax CI publishes plugin/PJRT wheels to s3://jax-ci-amd, fronted
          # by CloudFront. The build/{repo}/{ref}/{release-version}/LATEST file
          # holds the s3:// URI of the most recent successful build, which we
          # resolve to a CloudFront directory and pull matching wheels from.
          ROCM_WHEELS_BASE_URL="https://d22q5eopkfeftw.cloudfront.net"

          ROCM_FULL_VERSION="${INPUTS_ROCM_RELEASE_VERSION:-${INPUTS_ROCM_VERSION}}"

          if [ -n "${INPUTS_WHEEL_VERSION}" ]; then
            NAMESPACE="${INPUTS_WHEEL_VERSION}"
          else
            ROCM_MAJOR="${INPUTS_ROCM_VERSION%%.*}"
            NAMESPACE="${ROCM_MAJOR}"
            if [ "${NAMESPACE}" = "6" ]; then
              NAMESPACE="60"
            fi
          fi
          echo "Wheel namespace: jax_rocm${NAMESPACE}_*"

          LATEST_KEY="rocm-wheels/${INPUTS_WHEELS_REPO}/${INPUTS_WHEELS_REF}/${ROCM_FULL_VERSION}/LATEST"
          LATEST_URL="${ROCM_WHEELS_BASE_URL}/${LATEST_KEY}"
          echo "Resolving LATEST pointer: ${LATEST_URL}"

          RESOLVED_S3_URI=$(curl -fsSL "${LATEST_URL}" | tr -d '[:space:]')
          if [ -z "${RESOLVED_S3_URI}" ]; then
            echo "ERROR: empty LATEST pointer at ${LATEST_URL}"
            exit 1
          fi
          echo "Resolved S3 URI: ${RESOLVED_S3_URI}"

          WHEELS_PATH="${RESOLVED_S3_URI#s3://jax-ci-amd/}"
          WHEELS_URL="${ROCM_WHEELS_BASE_URL}/${WHEELS_PATH%/}"
          echo "Wheel directory: ${WHEELS_URL}"

          LISTING=$(curl -fsSL "${WHEELS_URL}/")
          FILES=$(echo "${LISTING}" \
            | grep -oE 'href="[^"]+\.whl"' \
            | cut -d'"' -f2 \
            | sort -u)
          if [ -z "${FILES}" ]; then
            echo "ERROR: no wheels listed at ${WHEELS_URL}/"
            exit 1
          fi
          echo "Available wheels:"
          echo "${FILES}"

          mkdir -p ./wheelhouse

          # CloudFront href is URL-encoded; decode for local filenames so pip
          # recognizes the wheel.
          decode() {
            python3 -c \
              'import sys,urllib.parse; print(urllib.parse.unquote(sys.argv[1]))' \
              "$1"
          }

          PJRT=$(echo "${FILES}" | grep "jax_rocm${NAMESPACE}_pjrt-" | head -n1)
          [ -n "${PJRT}" ] || { echo "ERROR: no pjrt wheel"; exit 1; }
          curl -fsSL "${WHEELS_URL}/${PJRT}" -o "./wheelhouse/$(decode "${PJRT}")"

          IFS=',' read -ra PYS <<< "${INPUTS_PYTHON_VERSIONS}"
          for py in "${PYS[@]}"; do
            TAG="cp${py//./}-cp${py//./}-"
            PL=$(echo "${FILES}" \
              | grep "jax_rocm${NAMESPACE}_plugin-" \
              | grep -- "${TAG}" \
              | head -n1)
            [ -n "${PL}" ] || { echo "ERROR: no plugin wheel for ${py}"; exit 1; }
            curl -fsSL "${WHEELS_URL}/${PL}" -o "./wheelhouse/$(decode "${PL}")"
          done

          ls -lah ./wheelhouse
      - name: Authenticate to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build JAX docker image
        run: |
          ls -lah ./wheelhouse
          python3 build/ci_build \
            --rocm-version="${{ inputs.rocm-version }}" \
            --rocm-build-job="${{ inputs.rocm-build-job }}" \
            --rocm-build-num="${{ inputs.rocm-build-num }}" \
            build_dockers
      - name: Push docker images
        env:
          EXTRA_CR_TAG: ${{ inputs.extra-cr-tag }}
          ROCM_VERSION: ${{ inputs.rocm-version }}
        run: |
          ubu24_img="ghcr.io/rocm/jax-ubu24.rocm${ROCM_VERSION//.}:${GITHUB_SHA}"
          echo "Ubuntu 24 image name: ${ubu24_img}"
          docker tag "jax-ubu24.rocm${ROCM_VERSION//.}" "${ubu24_img}"
          docker push "${ubu24_img}"
      - name: Push extra tags
        if: ${{ inputs.extra-cr-tag && github.event_name != 'pull_request' }}
        env:
          EXTRA_CR_TAG: ${{ inputs.extra-cr-tag }}
          ROCM_VERSION: ${{ inputs.rocm-version }}
        run: |
          ubu24_img="ghcr.io/rocm/jax-ubu24.rocm${ROCM_VERSION//.}:${EXTRA_CR_TAG}"
          echo "Ubuntu 24 image name: ${ubu24_img}"
          docker tag "jax-ubu24.rocm${ROCM_VERSION//.}" "${ubu24_img}"
          docker push "${ubu24_img}"

