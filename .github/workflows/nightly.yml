name: Nightly

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nightly.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  call-build-wheels:
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ["7.2.0"]
        include:
          - rocm-version: "7.2.0"
            runner-label: '["amd-do-linux.jax.cpu"]'
    uses: ./.github/workflows/build-wheels.yml
    with:
      python-versions: "3.11,3.12,3.13,3.14"
      rocm-version: ${{ matrix.rocm-version }}
      rocm-build-job: ${{ matrix.rocm-build-job }}
      rocm-build-num: ${{ matrix.rocm-build-num }}
      runner-label: ${{ matrix.runner-label }}
      builder-image: "search"
    secrets:
      rbe_ci_cert: ${{ secrets.RBE_CI_CERT }}
      rbe_ci_key: ${{ secrets.RBE_CI_KEY }}
  call-build-docker:
    needs: call-build-wheels
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ["7.2.0"]
        include:
          - rocm-version: "7.2.0"
            runner-label: '["amd-do-linux.jax.cpu"]'
    uses: ./.github/workflows/build-docker.yml
    with:
      rocm-version: ${{ matrix.rocm-version }}
      rocm-build-job: ${{ matrix.rocm-build-job }}
      rocm-build-num: ${{ matrix.rocm-build-num }}
      runner-label: ${{ matrix.runner-label }}
      extra-cr-tag: "nightly"
