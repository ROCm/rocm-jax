name: Build Base Docker Images

# Manual dispatch only on the rock10_clr_fix experiment branch: no cron, no push
# and no pull_request trigger, so this branch can never rebuild CI images by
# itself. See the therock-config job for what it does build.
on:
  workflow_dispatch:
    inputs:
      # Both inputs are ignored on this branch -- the image set and the tags are
      # fixed. They stay declared so that a dispatch which supplies them (the
      # GitHub UI renders the form from the default branch) still validates.
      push-latest-tag:
        description: "Ignored on this branch; :latest is never pushed from here"
        required: false
        type: boolean
        default: false
      image-set:
        description: "Ignored on this branch; always builds TheRock latest only"
        required: false
        type: choice
        options:
          - all
          - legacy
          - therock-pinned
          - therock-latest
        default: all

jobs:
  therock-config:
    # EXPERIMENT BRANCH (rock10_clr_fix) -- do not merge.
    #
    # This branch exists only to publish a CLR-hotpatched TheRock-latest image
    # set for A/B testing the rocm-systems #9019 fat-binary bound bug against
    # ROCm/jax CI. Compared to rocm-jax-infra:
    #
    #   * only the TheRock-latest (ROCm 10) images are built; the TheRock 7.14
    #     pinned set and the legacy apt ROCm 7.2.0 set are disabled outright, so
    #     nothing those flows consume can be touched from here;
    #   * `:latest` and the commit-SHA tags are never pushed. A single dedicated
    #     `clr_fix` tag is pushed instead, holding a libamdhip64 rebuilt from
    #     source with the bound fix.
    #
    # The image *names* stay jax-{base,dev}-ubu24.therock-latest and
    # jax-manylinux_2_28-therock-latest, so consumers only need to change the tag.
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.set.outputs.entries }}
    steps:
      - id: set
        run: |
          NIGHTLY="https://rocm.nightlies.amd.com/whl-multi-arch/"
          GFX_ARCH="device-gfx942,device-gfx950"
          fix="{\"therock-version\": \"\", \"therock-index-url\": \"$NIGHTLY\","
          fix="$fix \"gfx-arch\": \"$GFX_ARCH\","
          fix="$fix \"docker-tag\": \"clr_fix\", \"apply-clr-patch\": \"1\"}"
          entries="[$fix]"
          echo "CLR experiment selects: $entries"
          {
            echo 'entries<<JSON'
            echo "$entries"
            echo 'JSON'
          } >> "$GITHUB_OUTPUT"

  build-base-images:
    # Disabled on the rock10_clr_fix experiment branch: the legacy apt ROCm 7.2.0
    # images are unaffected by the CLR bug and must not be rebuilt from here.
    if: false
    name: >-
      ROCm ${{ matrix.rocm-version }},
      ${{ matrix.install-llvm && 'with' || 'without' }} LLVM
    runs-on: ${{ matrix.runner-label }}
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ["7.2.0"]
        install-llvm: [true, false]
        include:
          - rocm-version: "7.2.0"
            runner-label: "amd-do-linux.jax.cpu"
    steps:
      - name: Clean up old runs
        run: |
          ls -lah
          # Make sure that we own all of the files so that we have permissions to delete them
          docker run --rm -v "./:/rocm-jax" ubuntu \
            /bin/bash -c "shopt -s dotglob; chown -R $UID /rocm-jax/* || true"
          # Remove any old work directories from this machine
          rm -rf * || true
          ls -lah
          # Clean up any docker stuff that's more than a week old
          docker system prune -a --filter "until=168h"
          # Stop any containers running for more than 12 hours. No CI job should take this long.
          docker ps --format="{{.RunningFor}} {{.Names}}" | grep hours \
              | awk -F: '{if($1>12)print$1}' | awk ' {print $4} ' | xargs docker stop || true
      - name: Print system info
        run: |
          whoami
          printenv
          df -h
          rocm-smi -a || true
          rocminfo | grep gfx || true
      - uses: actions/checkout@v4
      - name: Build base docker image
        env:
          ROCM_BUILD_JOB: ${{ matrix.rocm-build-job }}
          ROCM_BUILD_NUM: ${{ matrix.rocm-build-num }}
        run: |
          BUILD_ARGS=""
          if [ -n "$ROCM_BUILD_JOB" ]; then
            BUILD_ARGS="$BUILD_ARGS --rocm-build-job=$ROCM_BUILD_JOB"
          fi
          if [ -n "$ROCM_BUILD_NUM" ]; then
            BUILD_ARGS="$BUILD_ARGS --rocm-build-num=$ROCM_BUILD_NUM"
          fi
          python3 build/ci_build \
            --rocm-version="${{ matrix.rocm-version }}" \
            $BUILD_ARGS \
            build_base_dockers \
            --filter="ubu24" \
            ${{ matrix.install-llvm && '--install-llvm --llvm-version 18' || '' }}
      - name: Authenticate to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push docker images
        env:
          ROCM_VERSION: ${{ matrix.rocm-version }}
          INSTALL_LLVM: ${{ matrix.install-llvm }}
        run: |
          # Construct image tag based on matrix values
          # ROCm version tag removes dots (7.1.1 -> 711, 7.2.0 -> 720)
          rocm_tag="rocm${ROCM_VERSION//.}"
          if [ "$INSTALL_LLVM" = "true" ]; then
            image_tag="jax-dev-ubu24.${rocm_tag}"
          else
            image_tag="jax-base-ubu24.${rocm_tag}"
          fi

          # Push with commit SHA tag
          ghcr_image_sha="ghcr.io/rocm/${image_tag}:${GITHUB_SHA}"
          echo "Image name (SHA): ${ghcr_image_sha}"
          docker tag "${image_tag}" "${ghcr_image_sha}"
          docker push "${ghcr_image_sha}"
      - name: Push latest tag
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' ||
          inputs.push-latest-tag == true)
        env:
          ROCM_VERSION: ${{ matrix.rocm-version }}
          INSTALL_LLVM: ${{ matrix.install-llvm }}
        run: |
          rocm_tag="rocm${ROCM_VERSION//.}"
          if [ "$INSTALL_LLVM" = "true" ]; then
            image_tag="jax-dev-ubu24.${rocm_tag}"
          else
            image_tag="jax-base-ubu24.${rocm_tag}"
          fi

          ghcr_image_latest="ghcr.io/rocm/${image_tag}:latest"
          echo "Image name (latest): ${ghcr_image_latest}"
          docker tag "${image_tag}" "${ghcr_image_latest}"
          docker push "${ghcr_image_latest}"

  build-therock-base-images:
    # CLR-hotpatched TheRock-latest base/dev images. See the therock-config job
    # for what this branch is for.
    needs: therock-config
    name: >-
      TheRock latest ${{ matrix.therock.docker-tag }},
      ${{ matrix.install-llvm && 'with' || 'without' }} LLVM
    runs-on: ${{ matrix.runner-label }}
    strategy:
      fail-fast: false
      matrix:
        install-llvm: [true, false]
        therock: ${{ fromJSON(needs.therock-config.outputs.entries) }}
        include:
          - runner-label: "amd-do-linux.jax.cpu"
    steps:
      - name: Clean up old runs
        run: |
          ls -lah
          docker run --rm -v "./:/rocm-jax" ubuntu \
            /bin/bash -c "shopt -s dotglob; chown -R $UID /rocm-jax/* || true"
          rm -rf * || true
          ls -lah
          docker system prune -a --filter "until=168h"
          docker ps --format="{{.RunningFor}} {{.Names}}" | grep hours \
              | awk -F: '{if($1>12)print$1}' | awk ' {print $4} ' | xargs docker stop || true
      - name: Print system info
        run: |
          whoami
          printenv
          df -h
      - uses: actions/checkout@v4
      - name: Build TheRock base docker image
        run: |
          ver_slug="${{ matrix.therock.therock-version || 'latest' }}"
          ver_slug="${ver_slug//+/.}"; ver_slug="${ver_slug// /}" # Match ci_build's sanitizing
          if [ "${{ matrix.install-llvm }}" = "true" ]; then
            image_tag="jax-dev-ubu24.therock-${ver_slug}"
          else
            image_tag="jax-base-ubu24.therock-${ver_slug}"
          fi
          docker build -f docker/Dockerfile.base-therock-ubu24 \
            --build-arg=GFX_ARCH="${{ matrix.therock.gfx-arch }}" \
            --build-arg=THEROCK_INDEX_URL="${{ matrix.therock.therock-index-url }}" \
            --build-arg=THEROCK_VERSION="${{ matrix.therock.therock-version }}" \
            --build-arg=INSTALL_LLVM=${{ matrix.install-llvm && '1' || '0' }} \
            --build-arg=LLVM_VERSION=${{ matrix.install-llvm && '18' || 'none' }} \
            --build-arg=APPLY_CLR_PATCH="${{ matrix.therock.apply-clr-patch }}" \
            -t "$image_tag" .
      - name: Report the ROCm and CLR versions in the image
        run: |
          ver_slug="${{ matrix.therock.therock-version || 'latest' }}"
          if [ "${{ matrix.install-llvm }}" = "true" ]; then
            image_tag="jax-dev-ubu24.therock-${ver_slug}"
          else
            image_tag="jax-base-ubu24.therock-${ver_slug}"
          fi
          docker run --rm "$image_tag" rocm-sdk version
          docker run --rm "$image_tag" bash -c \
            'ls -l "$(python3 -c "import site; print(site.getsitepackages()[0])")"/_rocm_sdk_core/lib/libamdhip64.so*'
      - name: Authenticate to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push CLR experiment tag
        if: github.event_name != 'pull_request'
        env:
          INSTALL_LLVM: ${{ matrix.install-llvm }}
          THEROCK_VERSION: ${{ matrix.therock.therock-version }}
          DOCKER_TAG: ${{ matrix.therock.docker-tag }}
        run: |
          ver_slug="${THEROCK_VERSION:-latest}"
          ver_slug="${ver_slug//+/.}"; ver_slug="${ver_slug// /}" # Match ci_build's sanitizing
          if [ "$INSTALL_LLVM" = "true" ]; then
            image_tag="jax-dev-ubu24.therock-${ver_slug}"
          else
            image_tag="jax-base-ubu24.therock-${ver_slug}"
          fi
          ghcr_base="ghcr.io/rocm/${image_tag}"

          # Only the experiment tag. Never :latest, never the commit SHA, so a
          # run from this branch cannot become what any other CI flow resolves.
          echo "Image name: ${ghcr_base}:${DOCKER_TAG}"
          docker tag "${image_tag}" "${ghcr_base}:${DOCKER_TAG}"
          docker push "${ghcr_base}:${DOCKER_TAG}"

  build-therock-manylinux-images:
    # TheRock-latest manylinux builder image. The CLR hotpatch is a runtime-only
    # concern so this image is unpatched, but it is rebuilt and pushed under the
    # same tag so that the wheels are built against the same TheRock nightly the
    # test images run, instead of whatever nightly `:latest` was last built from.
    needs: therock-config
    name: >-
      TheRock latest ${{ matrix.therock.docker-tag }}, manylinux
    runs-on: amd-do-linux.jax.cpu
    strategy:
      fail-fast: false
      matrix:
        therock: ${{ fromJSON(needs.therock-config.outputs.entries) }}
    steps:
      - name: Clean up old runs
        run: |
          ls -lah
          docker run --rm -v "./:/rocm-jax" ubuntu \
            /bin/bash -c "shopt -s dotglob; chown -R $UID /rocm-jax/* || true"
          rm -rf * || true
          ls -lah
          docker system prune -a --filter "until=168h"
          docker ps --format="{{.RunningFor}} {{.Names}}" \
            | grep hours \
            | awk -F: '{if($1>12)print$1}' \
            | awk '{print $4}' \
            | xargs docker stop || true
      - name: Print system info
        run: |
          whoami
          printenv
          df -h
      - uses: actions/checkout@v4
      - name: Build TheRock manylinux docker image
        run: |
          ver_slug="${{ matrix.therock.therock-version || 'latest' }}"
          ver_slug="${ver_slug//+/.}"; ver_slug="${ver_slug// /}" # Match ci_build's sanitizing
          image_tag="jax-manylinux_2_28-therock-${ver_slug}"
          docker build -f docker/manylinux/Dockerfile.jax-manylinux_2_28-therock \
            --build-arg=THEROCK_INDEX_URL="${{ matrix.therock.therock-index-url }}" \
            --build-arg=THEROCK_VERSION="${{ matrix.therock.therock-version }}" \
            --build-arg=GFX_ARCH="${{ matrix.therock.gfx-arch }}" \
            -t "$image_tag" .
      - name: Authenticate to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin
      - name: Push CLR experiment tag
        if: github.event_name != 'pull_request'
        env:
          THEROCK_VERSION: ${{ matrix.therock.therock-version }}
          DOCKER_TAG: ${{ matrix.therock.docker-tag }}
        run: |
          ver_slug="${THEROCK_VERSION:-latest}"
          ver_slug="${ver_slug//+/.}"; ver_slug="${ver_slug// /}" # Match ci_build's sanitizing
          image_tag="jax-manylinux_2_28-therock-${ver_slug}"
          ghcr_base="ghcr.io/rocm/${image_tag}"

          # Only the experiment tag -- see the base image job.
          echo "Image name: ${ghcr_base}:${DOCKER_TAG}"
          docker tag "${image_tag}" "${ghcr_base}:${DOCKER_TAG}"
          docker push "${ghcr_base}:${DOCKER_TAG}"

  build-manylinux-builder-images:
    # Disabled on the rock10_clr_fix experiment branch, as build-base-images is.
    if: false
    name: "ROCm ${{ matrix.rocm-version }}, manylinux"
    runs-on: ${{ matrix.runner-label }}
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ["7.2.0"]
        include:
          - rocm-version: "7.2.0"
            runner-label: "amd-do-linux.jax.cpu"
    steps:
      - name: Clean up old runs
        run: |
          ls -lah
          # Make sure that we own all of the files so that we have permissions to delete them
          docker run --rm -v "./:/rocm-jax" ubuntu \
            /bin/bash -c "shopt -s dotglob; chown -R $UID /rocm-jax/* || true"
          # Remove any old work directories from this machine
          rm -rf * || true
          ls -lah
          # Clean up any docker stuff that's more than a week old
          docker system prune -a --filter "until=168h"
          # Stop any containers running for more than 12 hours. No CI job should take this long.
          docker ps --format="{{.RunningFor}} {{.Names}}" | grep hours \
            | awk -F: '{if($1>12)print$1}' | awk ' {print $4} ' | xargs docker stop || true
      - uses: actions/checkout@v4
      - name: Build docker images
        run: |
          python3 build/ci_build \
            --rocm-version="${{ matrix.rocm-version }}" \
            --rocm-build-job="${{ matrix.rocm-build-job }}" \
            --rocm-build-num="${{ matrix.rocm-build-num }}" \
            build_manylinux_dockers
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push docker images
        env:
          ROCM_VERSION: ${{ matrix.rocm-version }}
          ROCM_BUILD_JOB: >-
            ${{ matrix.rocm-build-job && format('-{0}', inputs.rocm-build-job) || '' }}
          ROCM_BUILD_NUM: >-
            ${{ matrix.rocm-build-num && format('-{0}', inputs.rocm-build-num) || '' }}
        run: |
          image_tag="ghcr.io/rocm/jax-manylinux_2_28-rocm-${ROCM_VERSION}${ROCM_BUILD_JOB}${ROCM_BUILD_NUM}"

          # Push with commit SHA tag
          sha_image_tag="${image_tag}:${GITHUB_SHA}"
          echo "Image name (SHA): ${sha_image_tag}"
          docker tag "${image_tag}" "${sha_image_tag}"
          docker push "${sha_image_tag}"
      - name: Push latest tag
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' ||
          inputs.push-latest-tag == true)
        env:
          ROCM_VERSION: ${{ matrix.rocm-version }}
          ROCM_BUILD_JOB: >-
            ${{ matrix.rocm-build-job && format('-{0}', inputs.rocm-build-job) || '' }}
          ROCM_BUILD_NUM: >-
            ${{ matrix.rocm-build-num && format('-{0}', inputs.rocm-build-num) || '' }}
        run: |
          image_tag="ghcr.io/rocm/jax-manylinux_2_28-rocm-${ROCM_VERSION}${ROCM_BUILD_JOB}${ROCM_BUILD_NUM}"

          latest_image_tag="${image_tag}:latest"
          echo "Image Name (latest): ${latest_image_tag}"
          docker tag "${image_tag}" "${latest_image_tag}"
          docker push "${latest_image_tag}"

