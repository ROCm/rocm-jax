name: CI

on:
  push:
    branches:
      - master
      - 'rocm-jaxlib-v*'
  pull_request:
    branches:
      - master
      - 'rocm-jaxlib-v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  call-build-docker:
    strategy:
      matrix:
        rocm-version: ["7.2.0"]
    uses: ./.github/workflows/build-docker.yml
    with:
      rocm-version: ${{ matrix.rocm-version }}
      runner-label: '["amd-do-linux.jax.cpu"]'
  run-python-unit-tests:
    name: run-python-unit-tests (deprecated)
    needs: call-build-docker
    runs-on: ubuntu-latest
    steps:
      - name: JAX wheel validation moved to ROCm/jax
        run: |
          echo "::warning::rocm-jax JAX wheel validation is deprecated."
          echo "Use ROCm/jax pytest_rocm.yml / bazel_rocm.yml for JAX wheel testing."

