name: Build ROCm and TheRock JAX and XLA Docker images

on:
  push:
    branches:
      - hhs/add_docker_for_jax_xla
  workflow_call:
    inputs:
      rocm-version:
        required: false
        type: string
      runner-label:
        required: false
        default: linux-x86-64-1gpu-amd
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    runs-on: ${{ inputs.runner-label || 'linux-x86-64-1gpu-amd' }}
    env:
      ROCM_VERSION: ${{ inputs.rocm-version || '7.2.4' }}
      THEROCK_VERSION: ${{ inputs.theRock-version || '7.13.0' }}
      THEROCK_INDEX_URL: ${{ inputs.theRock-index-url || 'https://repo.amd.com/rocm/whl/gfx950-dcgpu/' }}
    steps:
      - name: Print system info
        run: |
          whoami
          printenv
          df -h
          rocm-smi -a || true
          rocminfo | grep gfx || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build ROCm JAX docker image
        working-directory: ./docker
        run: |
          IMAGE="ghcr.io/rocm/jax-ubu22.rocm${ROCM_VERSION}"

          docker build -f Dockerfile.rocm \
            --build-arg ROCM_VERSION="${ROCM_VERSION}" \
            -t "${IMAGE}:latest" .

      - name: Push ROCm JAX docker image
        working-directory: ./docker
        run: |
          IMAGE="ghcr.io/rocm/jax-ubu22.rocm${ROCM_VERSION}"

          docker push "${IMAGE}:latest"
      - name: Build TheRock JAX docker image
        working-directory: ./docker
        run: |
          IMAGE="ghcr.io/rocm/jax-ubu22.theRock${THEROCK_VERSION}"

          docker build -f Dockerfile.theRock \
            --build-arg THEROCK_INDEX_URL="${THEROCK_INDEX_URL}" \
            --build-arg THEROCK_VERSION="${THEROCK_VERSION}" \
            -t "${IMAGE}:latest" .

      - name: Push TheRock JAX docker image
        working-directory: ./docker
        run: |
          IMAGE="ghcr.io/rocm/jax-ubu22.theRock${THEROCK_VERSION}"

          docker push "${IMAGE}:latest"
