name: Build wheels

on:
  workflow_call:
    inputs:
      python-versions:
        required: true
        type: string
      rocm-version:
        required: true
        type: string
      rocm-build-job:
        required: false
        type: string
      rocm-build-num:
        required: false
        type: string
      runner-label:
        required: false
        type: string
      artifact-prefix:
        required: false
        default: 'plugin_wheels'
        type: string
      jax-repo:
        description: >-
          JAX repository to checkout for jaxlib build. Leave empty to skip
          (JAX 0.9.1+ uses upstream PyPI jaxlib).
        required: false
        type: string
        default: ''
      jax-ref:
        description: >-
          JAX git ref (branch, tag, or commit) to checkout for jaxlib build.
          Leave empty to skip (JAX 0.9.1+ uses upstream PyPI jaxlib).
        required: false
        type: string
        default: ''
      builder-image:
        required: false
        type: string
        default: ''
      rocm-jax-repo:
        description: ROCm JAX repository to use for wheel builds.
        required: false
        type: string
        default: 'ROCm/jax'
      rocm-jax-ref:
        description: ROCm JAX ref that contains the artifact build workflow logic.
        required: false
        type: string
        default: 'test/org-gated-ci'
      rocm-release-version:
        description: Full ROCm release version used for manylinux image selection.
        required: false
        type: string
        default: ''
      manylinux-image:
        description: Override the ROCm/jax manylinux image, e.g. TheRock latest.
        required: false
        type: string
        default: ''
    secrets:
      rbe_ci_key:
        required: true
      rbe_ci_cert:
        required: true

jobs:
  build-plugin-wheels:
    name: build-plugin-wheels (deprecated)
    runs-on: ubuntu-latest
    steps:
      - name: Wheel builds moved to ROCm/jax
        run: |
          echo "::warning::rocm-jax wheel builds are deprecated."
          echo "Use ROCm/jax for JAX ROCm plugin and PJRT wheel builds:"
          echo "  https://github.com/ROCm/jax"
          echo "This repository is retained for Docker image infrastructure only."
